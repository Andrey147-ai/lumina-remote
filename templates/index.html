<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lumina Remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    /* ── Reset & Base ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #12121a;
      --surface2:  #1a1a28;
      --border:    rgba(255,255,255,0.07);
      --accent:    #7c6af5;
      --accent2:   #f5c26a;
      --accent3:   #6af5c2;
      --danger:    #f56a6a;
      --text:      #e8e8f0;
      --muted:     #6b6b88;
      --radius:    14px;
      --transition: 0.18s cubic-bezier(.4,0,.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      padding: 0 0 60px;
      /* subtle grid background */
      background-image:
        linear-gradient(rgba(124,106,245,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,106,245,.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: .9rem;
    }
    .logo span { color: var(--muted); font-weight: 400; font-size: .8rem; margin-left: 2px; }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent3);
      box-shadow: 0 0 8px var(--accent3);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .4; }
    }

    .btn-logout {
      font-family: 'Syne', sans-serif;
      font-size: .75rem; font-weight: 600;
      background: none; border: 1px solid var(--border);
      color: var(--muted); border-radius: 8px;
      padding: 6px 12px; cursor: pointer;
      transition: var(--transition);
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Layout ─────────────────────────────────────────────────────── */
    main { max-width: 640px; margin: 0 auto; padding: 28px 16px 0; }

    /* ── Toast ──────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      padding: 10px 18px; border-radius: 10px;
      white-space: nowrap;
      transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
      opacity: 0; z-index: 999;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.error { border-left-color: var(--danger); }

    /* ── Section Labels ─────────────────────────────────────────────── */
    .section-label {
      font-size: .68rem; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label::after {
      content: ''; flex: 1; height: 1px;
      background: var(--border);
    }

    /* ── Cards / Grid ───────────────────────────────────────────────── */
    .section { margin-bottom: 32px; }

    .grid { display: grid; gap: 10px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }

    /* ── Action Button ──────────────────────────────────────────────── */
    .action-btn {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 12px;
      cursor: pointer;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: .82rem; font-weight: 600;
      text-align: center;
      transition: var(--transition);
      position: relative; overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: var(--btn-glow, transparent);
      opacity: 0;
      transition: opacity .25s;
    }
    .action-btn:hover { border-color: var(--btn-accent, var(--accent)); transform: translateY(-2px); }
    .action-btn:hover::before { opacity: .07; }
    .action-btn:active { transform: scale(.96) translateY(0); }
    .action-btn.loading { pointer-events: none; opacity: .6; }

    .action-btn .icon {
      font-size: 1.6rem;
      filter: drop-shadow(0 0 6px var(--btn-accent, var(--accent)));
    }

    /* colour variants */
    .btn-purple { --btn-accent: var(--accent);  --btn-glow: var(--accent); }
    .btn-gold   { --btn-accent: var(--accent2); --btn-glow: var(--accent2); }
    .btn-teal   { --btn-accent: var(--accent3); --btn-glow: var(--accent3); }
    .btn-red    { --btn-accent: var(--danger);  --btn-glow: var(--danger); }

    /* wide (full-row) button */
    .action-btn.wide {
      flex-direction: row; justify-content: flex-start;
      gap: 14px; padding: 16px 20px;
    }
    .action-btn.wide .icon { font-size: 1.3rem; }
    .action-btn.wide .label { text-align: left; }
    .action-btn.wide .sublabel {
      font-size: .7rem; font-weight: 400;
      color: var(--muted); font-family: 'JetBrains Mono', monospace;
    }

    /* ── Screenshot Section ─────────────────────────────────────────── */
    #screenshot-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 80px;
      display: flex; align-items: center; justify-content: center;
    }
    #screenshot-wrap img { width: 100%; display: block; border-radius: var(--radius); }
    #screenshot-placeholder {
      color: var(--muted); font-size: .8rem;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .05em;
    }

    .btn-screenshot {
      width: 100%;
      flex-direction: row; gap: 10px;
      justify-content: center;
      padding: 14px;
      margin-top: 10px;
    }

    /* ── Volume slider bar ──────────────────────────────────────────── */
    .vol-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    /* ── Responsive tweaks ──────────────────────────────────────────── */
    @media (max-width: 360px) {
      .grid-3 { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    Lumina <span>REMOTE</span>
  </div>
  <div class="header-actions">
    <div class="status-dot" title="Connected"></div>
    <button class="btn-logout" onclick="window.location='/logout'">Logout</button>
  </div>
</header>

<main>

  <!-- ── Quick Links ─────────────────────────────────────────────── -->
  <section class="section">
    <div class="section-label">Quick Links</div>
    <div class="grid grid-2">
      {% for label, url in links.items() %}
      <button class="action-btn btn-purple"
              onclick="openLink('{{ label }}')">
        <span class="icon">
          {% if 'github' in label|lower %}🐙
          {% elif 'youtube' in label|lower %}▶️
          {% elif 'host' in label|lower %}🖥️
          {% else %}🔗{% endif %}
        </span>
        <span>{{ label }}</span>
      </button>
      {% endfor %}
    </div>
  </section>

  <!-- ── Launch Apps ─────────────────────────────────────────────── -->
  <section class="section">
    <div class="section-label">Launch Apps</div>
    <div class="grid grid-2">
      {% for app_name in apps %}
      <button class="action-btn btn-teal"
              onclick="launchApp('{{ app_name }}')">
        <span class="icon">
          {% if 'telegram' in app_name|lower %}✈️
          {% elif 'code' in app_name|lower %}🧑‍💻
          {% elif 'notepad' in app_name|lower %}📝
          {% elif 'explorer' in app_name|lower %}📁
          {% else %}🚀{% endif %}
        </span>
        <span>{{ app_name }}</span>
      </button>
      {% endfor %}
    </div>
  </section>

  <!-- ── Volume ──────────────────────────────────────────────────── -->
  <section class="section">
    <div class="section-label">Volume</div>
    <div class="vol-row">
      <button class="action-btn btn-gold" onclick="volumeCtrl('down')">
        <span class="icon">🔉</span>
        <span>Vol –10%</span>
      </button>
      <button class="action-btn btn-gold" onclick="volumeCtrl('mute')">
        <span class="icon">🔇</span>
        <span>Mute</span>
      </button>
      <button class="action-btn btn-gold" onclick="volumeCtrl('up')">
        <span class="icon">🔊</span>
        <span>Vol +10%</span>
      </button>
    </div>
  </section>

  <!-- ── Screenshot ──────────────────────────────────────────────── -->
  <section class="section">
    <div class="section-label">Screenshot</div>
    <div id="screenshot-wrap">
      <span id="screenshot-placeholder">— No screenshot taken yet —</span>
    </div>
    <button class="action-btn btn-purple btn-screenshot" onclick="takeScreenshot()">
      <span class="icon">📸</span>
      <span>Capture Screen</span>
    </button>
  </section>

  <!-- ── System Controls ─────────────────────────────────────────── -->
  <section class="section">
    <div class="section-label">System Controls</div>
    <div class="grid" style="grid-template-columns:1fr 1fr;">

      <button class="action-btn wide btn-teal" onclick="sysCtrl('lock')">
        <span class="icon">🔒</span>
        <div class="label">Lock PC<div class="sublabel">Windows + L</div></div>
      </button>

      <button class="action-btn wide btn-teal" onclick="sysCtrl('sleep')">
        <span class="icon">💤</span>
        <div class="label">Sleep<div class="sublabel">Low power</div></div>
      </button>

      <button class="action-btn wide btn-red"
              onclick="confirmAction('restart','⚠️ Restart in 10 s — proceed?')">
        <span class="icon">🔄</span>
        <div class="label">Restart<div class="sublabel">10 s delay</div></div>
      </button>

      <button class="action-btn wide btn-red"
              onclick="confirmAction('shutdown','⚠️ Shutdown in 10 s — proceed?')">
        <span class="icon">⏻</span>
        <div class="label">Shutdown<div class="sublabel">10 s delay</div></div>
      </button>

    </div>
    <div class="grid" style="margin-top:10px;">
      <button class="action-btn wide btn-purple" onclick="sysCtrl('abort')">
        <span class="icon">🛑</span>
        <div class="label">Abort Shutdown / Restart<div class="sublabel">Cancel pending action</div></div>
      </button>
    </div>
  </section>

</main>

<!-- ── Toast ─────────────────────────────────────────────────────────── -->
<div id="toast"></div>

<script>
  /* ── Helpers ──────────────────────────────────────────────────── */
  const toast = document.getElementById('toast');
  let toastTimer = null;

  function showToast(msg, isError = false) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = 'show' + (isError ? ' error' : '');
    toastTimer = setTimeout(() => { toast.className = ''; }, 3000);
  }

  async function post(url, body = {}) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return res.json();
  }

  function withLoading(btn, fn) {
    btn.classList.add('loading');
    fn().finally(() => btn.classList.remove('loading'));
  }

  /* ── Actions ──────────────────────────────────────────────────── */
  function openLink(label) {
    const btn = event.currentTarget;
    withLoading(btn, async () => {
      const data = await post('/api/open-url', { label });
      showToast(data.ok ? `🔗 ${data.message}` : `❌ ${data.error}`, !data.ok);
    });
  }

  function launchApp(app) {
    const btn = event.currentTarget;
    withLoading(btn, async () => {
      const data = await post('/api/launch-app', { app });
      showToast(data.ok ? `🚀 ${data.message}` : `❌ ${data.error}`, !data.ok);
    });
  }

  function volumeCtrl(action) {
    const btn = event.currentTarget;
    withLoading(btn, async () => {
      const data = await post(`/api/volume/${action}`);
      showToast(data.ok ? `🔊 ${data.message}` : `❌ ${data.error}`, !data.ok);
    });
  }

  async function takeScreenshot() {
    const btn = event.currentTarget;
    btn.classList.add('loading');
    try {
      const res = await fetch('/api/screenshot');
      if (!res.ok) throw new Error('Failed');
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const wrap = document.getElementById('screenshot-wrap');
      wrap.innerHTML = `<img src="${url}" alt="Screenshot"/>`;
      showToast('📸 Screenshot captured');
    } catch {
      showToast('❌ Screenshot failed', true);
    } finally {
      btn.classList.remove('loading');
    }
  }

  function sysCtrl(action) {
    const btn = event.currentTarget;
    withLoading(btn, async () => {
      const data = await post(`/api/system/${action}`);
      showToast(data.ok ? `✅ ${data.message}` : `❌ ${data.error}`, !data.ok);
    });
  }

  function confirmAction(action, message) {
    if (confirm(message)) sysCtrl(action);
  }
</script>
</body>
</html>
