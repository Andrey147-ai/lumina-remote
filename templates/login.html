<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lumina — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0f;
      --surface: #12121a;
      --border:  rgba(255,255,255,0.07);
      --accent:  #7c6af5;
      --accent3: #6af5c2;
      --danger:  #f56a6a;
      --text:    #e8e8f0;
      --muted:   #6b6b88;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: grid; place-items: center;
      background-image:
        linear-gradient(rgba(124,106,245,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,106,245,.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .card {
      width: 100%; max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px 28px;
      margin: 20px;
    }

    .logo {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 1.3rem;
    }
    .logo h1 { font-size: 1.25rem; font-weight: 800; }
    .logo p  { font-size: .72rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

    label {
      display: block;
      font-size: .72rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: .9rem;
      outline: none;
      transition: border-color .18s;
    }
    input[type="password"]:focus { border-color: var(--accent); }

    .error-msg {
      background: rgba(245, 106, 106, .1);
      border: 1px solid rgba(245,106,106,.3);
      border-radius: 8px;
      color: var(--danger);
      font-size: .78rem;
      font-family: 'JetBrains Mono', monospace;
      padding: 10px 14px;
      margin-top: 14px;
    }

    button[type="submit"] {
      width: 100%; margin-top: 20px;
      background: linear-gradient(135deg, var(--accent), #9b8cf8);
      border: none; border-radius: 10px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: .9rem; font-weight: 700;
      padding: 14px;
      cursor: pointer;
      transition: opacity .18s, transform .18s;
    }
    button[type="submit"]:hover  { opacity: .88; transform: translateY(-1px); }
    button[type="submit"]:active { transform: scale(.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div>
        <h1>Lumina</h1>
        <p>REMOTE CONTROL</p>
      </div>
    </div>

    <form method="POST" action="/login">
      <label for="password">Access Password</label>
      <input type="password" id="password" name="password"
             placeholder="Enter your password…" autofocus autocomplete="current-password"/>

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}

      <button type="submit">Unlock Dashboard →</button>
    </form>
  </div>
</body>
</html>
